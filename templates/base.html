<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="{% block description %}Golden Circle Homecare provides certified, compassionate care for seniors in Marikina. Professional care with the warmth of a real home.{% endblock %}"/>
    <meta name="google-site-verification" content="__V16IqTbk4Mn9CmFoj8mEzWZ48irWDvl7Tc_81kzO0" />
    <title>{% block title %}Golden Circle Homecare{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap"/>
        <link rel="stylesheet" href="/static/css/style.css"/>
        <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png"/>
        <link rel="icon" type="image/png" sizes="64x64" href="/static/images/favicon-64.png"/>
        <link rel="apple-touch-icon" href="/static/images/favicon-apple.png"/>
        <meta property="og:title" content="{% block og_title %}Golden Circle Homecare{% endblock %}"/>
        <meta property="og:description" content="{% block og_description %}Golden Circle Homecare provides certified, compassionate care for seniors in Marikina. Professional care with the warmth of a real home.{% endblock %}"/>
        <meta property="og:url" content="https://www.goldencirclehomecare.com{% block og_url %}/{% endblock %}"/>
        <meta property="og:image" content="/static/images/OGImage.png"/>
        <meta property="og:type" content="website"/>
        <meta property="og:site_name" content="Golden Circle Homecare">

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Golden Circle Homecare",
          "url": "https://www.goldencirclehomecare.com"
        }
        </script>

        {% block extra_head %}{% endblock %}
