<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Golden Family Homecare provides certified, compassionate care for seniors in Marikina. Professional care with the warmth of a real home."/>
  <title>Admin Login – Golden Family Homecare</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"/>
</head>
<body>

  <div class="admin-wrapper">
    <div class="admin-box">
      <h2>Admin Login</h2>
      <p class="subtitle">Golden Family Homecare Staff Portal</p>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@goldenfamilyhomecare.com"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Sign In</button>
      <p id="login-msg" class="form-message"></p>
      <p style="margin-top:1.25rem;text-align:center;font-size:0.875rem;">
        <a href="/" style="color:var(--sage-dark);">← Back to site</a>
      </p>
    </div>
  </div>

  <script src="/static/js/admin.js"></script>
  <script>
    // If already logged in, skip login page
    if (localStorage.getItem("sb_access_token")) {
      window.location.href = "/admin/dashboard";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") adminLogin();
    });
  </script>
</body>
</html>
