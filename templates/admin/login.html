<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Capati Homecare</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

  <div class="admin-wrapper">
    <div class="admin-box">
      <h2>Admin Login</h2>
      <p class="subtitle">Capati Homecare Staff Portal</p>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@capatihomecare.com"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Sign In</button>
      <p id="login-msg" class="form-message"></p>
      <p style="margin-top:1.25rem;text-align:center;font-size:0.875rem;">
        <a href="/" style="color:var(--sage-dark);">← Back to site</a>
      </p>
    </div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
