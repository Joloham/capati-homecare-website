<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact – Capati Homecare</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"/>
</head>
<body>

  <div id="navbar-container"></div>

  <section>
    <p class="section-label">Get in Touch</p>
    <h2 class="section-title">Contact Us</h2>
    <p class="section-sub">Have questions or want to schedule a visit? Send us a message and we'll get back to you shortly.</p>

    <div style="display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:2rem;">
      <div style="display:flex;align-items:center;gap:0.6rem;font-size:0.95rem;color:var(--text-mid);">
        <span style="font-size:1.3rem;">📍</span>
        <span>43 Gold Street, Concepcion Dos, Marikina City, Metro Manila</span>
      </div>
      <div style="display:flex;align-items:center;gap:0.6rem;font-size:0.95rem;color:var(--text-mid);">
        <span style="font-size:1.3rem;">📞</span>
        <a href="tel:+639001234567" style="color:var(--sage-dark);">+63 900 123 4567</a>
      </div>
    </div>

    <div style="max-width: 560px;">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Juan dela Cruz"/>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="juan@email.com"/>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Tell us how we can help..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="submitContact()">Send Message</button>
      <p id="form-msg" class="form-message"></p>

      <div style="margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);">
        <p style="font-size:0.875rem;color:var(--text-mid);margin-bottom:0.75rem;">You can also reach us on Facebook:</p>
        <a href="https://facebook.com/capatihomecare" target="_blank" rel="noopener noreferrer"
           style="display:inline-flex;align-items:center;gap:0.6rem;background:#1877F2;color:white;padding:0.6rem 1.25rem;border-radius:50px;font-size:0.9rem;font-weight:700;text-decoration:none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="white">
            <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.791-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
          </svg>
          Message us on Facebook
        </a>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/contact.js"></script>
</body>
</html>
